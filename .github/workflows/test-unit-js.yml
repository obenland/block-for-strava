name: JS Unit Tests

on:
    push:
        branches: [trunk]
        paths:
            - 'src/**'
            - 'tests/js/**'
            - 'jest-unit.config.js'
            - 'tsconfig.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-unit-js.yml'
    pull_request:
        branches: [trunk]
        paths:
            - 'src/**'
            - 'tests/js/**'
            - 'jest-unit.config.js'
            - 'tsconfig.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-unit-js.yml'
            - 'README.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    js-test:
        name: 'JS Unit Tests'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Run JS unit tests
              run: npm run test:unit:js
