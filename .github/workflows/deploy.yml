name: Deploy to WordPress.org

on:
    push:
        tags:
            - '*'

permissions:
    contents: read

jobs:
    tag:
        name: New tag
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Build
              run: npm run build

            - name: Install WP-CLI with dist-archive
              run: |
                  curl -sSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                  sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
                  wp package install wp-cli/dist-archive-command:@stable

            - name: Build distribution zip
              run: wp dist-archive . "$GITHUB_WORKSPACE/${{ github.event.repository.name }}.zip"

            - name: Attach zip to GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip

            - name: WordPress Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
