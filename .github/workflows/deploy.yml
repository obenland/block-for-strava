name: Deploy to WordPress.org

on:
    push:
        tags:
            - '*'

permissions:
    contents: write

jobs:
    tag:
        name: New tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Build
              run: npm run build

            - name: Build distribution zip
              run: |
                  SLUG="${{ github.event.repository.name }}"
                  STAGING="$RUNNER_TEMP/staging/$SLUG"
                  mkdir -p "$STAGING"
                  # Anchor every .distignore pattern to the repo root for rsync,
                  # then add VCS metadata that .distignore does not list.
                  sed 's|^|/|' .distignore > "$RUNNER_TEMP/rsync-excludes"
                  printf '%s\n' '/.git' '/.svn' >> "$RUNNER_TEMP/rsync-excludes"
                  rsync -a --exclude-from="$RUNNER_TEMP/rsync-excludes" ./ "$STAGING/"
                  (cd "$RUNNER_TEMP/staging" && zip -qr "$GITHUB_WORKSPACE/$SLUG.zip" "$SLUG")

            - name: Attach zip to GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip

            - name: WordPress Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
