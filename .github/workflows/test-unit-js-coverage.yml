name: JS Unit Test Coverage

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - 'src/**'
            - 'tests/js/**'
            - 'jest-unit.config.js'
            - 'tsconfig.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-unit-js-coverage.yml'
            - '.github/scripts/upsert-coverage-comment.ts'
            - 'README.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    js-coverage:
        name: 'JS Coverage Analysis'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Run JS unit tests with coverage
              run: npm run test:unit:js:coverage

            - name: Build coverage summary from json-summary
              run: |
                  # Render the totals row of coverage/js/coverage-summary.json
                  # (Jest's json-summary reporter) into a fenced text block
                  # that mirrors the PHPUnit text-coverage output, so both
                  # sections of the PR comment read at a glance.
                  if [ ! -f coverage/js/coverage-summary.json ]; then
                      echo "::error::coverage/js/coverage-summary.json not found — Jest did not emit json-summary."
                      exit 1
                  fi
                  mkdir -p coverage/js
                  node --input-type=module -e '
                      import { readFileSync, writeFileSync } from "node:fs";
                      const t = JSON.parse(readFileSync("coverage/js/coverage-summary.json", "utf8")).total;
                      const fmt = (m) => `${m.pct.toFixed(2)}% (${m.covered}/${m.total})`;
                      const lines = [
                          "```text",
                          "Summary:",
                          `  Statements: ${fmt(t.statements)}`,
                          `  Branches:   ${fmt(t.branches)}`,
                          `  Functions:  ${fmt(t.functions)}`,
                          `  Lines:      ${fmt(t.lines)}`,
                          "```",
                      ];
                      writeFileSync("coverage/js/summary.md", lines.join("\n"));
                  '

            - name: Upsert coverage comment
              # GITHUB_TOKEN is read-only on pull_request events from forks,
              # so skip the comment step there to avoid permission errors.
              if: github.event.pull_request.head.repo.fork == false
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SECTION: js
                  SECTION_TITLE: JavaScript
                  CONTENT_FILE: coverage/js/summary.md
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: node .github/scripts/upsert-coverage-comment.ts
