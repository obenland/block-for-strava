name: JS Unit Test Coverage

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - 'src/**'
            - 'tests/js/**'
            - 'jest-unit.config.js'
            - 'tsconfig.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-unit-js-coverage.yml'
            - '.github/scripts/upsert-coverage-comment.mjs'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    js-coverage:
        name: 'JS Coverage Analysis'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Run JS unit tests with coverage
              run: npm run test-unit-js:coverage

            - name: Build coverage table from json-summary
              run: |
                  # Render coverage/js/coverage-summary.json (emitted by Jest's
                  # json-summary reporter) into a Markdown table written to
                  # coverage/js/summary.md for the upsert step to pick up.
                  if [ ! -f coverage/js/coverage-summary.json ]; then
                      echo "::error::coverage/js/coverage-summary.json not found — Jest did not emit json-summary."
                      exit 1
                  fi
                  node --input-type=module -e '
                      import { readFileSync, writeFileSync } from "node:fs";
                      const summary = JSON.parse(readFileSync("coverage/js/coverage-summary.json", "utf8"));
                      const cwd = process.cwd() + "/";
                      const fmt = (m) => `${m.pct.toFixed(2)}% (${m.covered}/${m.total})`;
                      const rows = ["| File | % Stmts | % Branch | % Funcs | % Lines |", "| --- | --- | --- | --- | --- |"];
                      const total = summary.total;
                      rows.push(`| **All files** | ${fmt(total.statements)} | ${fmt(total.branches)} | ${fmt(total.functions)} | ${fmt(total.lines)} |`);
                      for (const path of Object.keys(summary).filter((k) => k !== "total").sort()) {
                          const m = summary[path];
                          const rel = path.startsWith(cwd) ? path.slice(cwd.length) : path;
                          rows.push(`| ${rel} | ${fmt(m.statements)} | ${fmt(m.branches)} | ${fmt(m.functions)} | ${fmt(m.lines)} |`);
                      }
                      writeFileSync("coverage/js/summary.md", rows.join("\n"));
                  '

            - name: Upsert coverage comment
              # GITHUB_TOKEN is read-only on pull_request events from forks,
              # so skip the comment step there to avoid permission errors.
              if: github.event.pull_request.head.repo.fork == false
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SECTION: js
                  SECTION_TITLE: JavaScript
                  CONTENT_FILE: coverage/js/summary.md
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: node .github/scripts/upsert-coverage-comment.mjs
