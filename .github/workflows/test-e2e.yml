name: E2E Tests

on:
    push:
        branches: [trunk]
        paths:
            - 'src/**'
            - 'tests/e2e/**'
            - 'includes/**'
            - 'block-for-strava.php'
            - 'composer.json'
            - 'composer.lock'
            - 'playwright.config.ts'
            - '.wp-env.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-e2e.yml'
    pull_request:
        branches: [trunk]
        paths:
            - 'src/**'
            - 'tests/e2e/**'
            - 'includes/**'
            - 'block-for-strava.php'
            - 'composer.json'
            - 'composer.lock'
            - 'playwright.config.ts'
            - '.wp-env.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-e2e.yml'
            - 'README.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Get installed Playwright version
              id: playwright-version
              run: |
                  version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright browsers and system deps
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npm run test:e2e:install

            - name: Install Playwright system deps only (cache hit)
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: Build plugin
              run: npm run build

            - name: Start wp-env
              run: npm run wp-env start

            - name: Run E2E tests
              run: npm run test:e2e

            - name: Upload test report
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
